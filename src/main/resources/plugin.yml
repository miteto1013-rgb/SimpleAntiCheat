name: SimpleAntiCheat
version: 0.2.0
main: me.anticheat.AntiCheatPlugin
api-version: '1.21'
description: Home-made anti-cheat (movement, combat, boats, totems).

commands:
  ac:
    description: Anti-cheat commands
    usage: /ac <alerts|freeze|unfreeze>
    aliases: [anticheat]

permissions:
  anticheat.alerts:
    description: Receive anti-cheat flag alerts in chat and use /ac alerts
    default: op
  anticheat.admin:
    description: Freeze and unfreeze players with /ac
    default: op
